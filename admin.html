<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ניהול הזמנות</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap">
<style>
:root{color-scheme:light}*{box-sizing:border-box}
body{margin:0;font-family:"Rubik",system-ui,sans-serif;background:#f1f4fa;color:#1f2a44;font-size:16px}
.page{max-width:720px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:16px}
h1{margin:0}h2{margin:0;font-size:1.15rem}
a.back{align-self:flex-start;color:#1f2a44;background:#fff;border:2px solid #d6dded;padding:8px 14px;border-radius:999px;text-decoration:none}
.card{background:#fff;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;border:1px solid #d6dded}
form.row,.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input{font:inherit;padding:9px 12px;border:2px solid #d6dded;border-radius:10px;flex:1;min-width:160px}
button{font:inherit;font-weight:500;border:0;border-radius:10px;padding:9px 16px;background:#2f6fd6;color:#fff;cursor:pointer}
button.ghost{background:transparent;color:#2f6fd6;border:2px solid #2f6fd6}
button.link{background:none;color:#c2412d;padding:4px 8px}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
li{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 10px;border:1px solid #e1e6f3;border-radius:10px}
code{direction:ltr;unicode-bidi:isolate;font-size:.8rem;overflow-wrap:anywhere;color:#5b6782}
.muted{color:#5b6782;margin:0}
</style>
</head>
<body>
<div class="page">
  <a class="back" href="index.html#home">→ חזרה לדף הבית</a>
  <h1>ניהול הזמנות</h1>
  <div id="main"><p class="muted">טוען…</p></div>
</div>
<script type="module">
import { Honey } from "./js/honey.js";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const link = (code) => Honey.homeUrl("index.html?invite=" + encodeURIComponent(code));
const copy = async (t) => { try { await navigator.clipboard.writeText(t); alert("הקישור הועתק"); } catch { prompt("העתיקי את הקישור:", t); } };
async function render() {
  await Honey.ready;
  const main = $("#main");
  if (!Honey.enabled) return (main.innerHTML = `<p class="muted">הכניסה עוד לא הוגדרה (js/firebase-config.js).</p>`);
  if (!Honey.user) return (main.innerHTML = `<p class="muted">נכנסים כמנהלת כדי לנהל הזמנות.</p><button id="in">🔑 כניסה</button>`, $("#in").onclick = Honey.signIn);
  if (!Honey.isAdmin) return (main.innerHTML = `<p class="muted">הדף הזה רק למנהלת האתר.</p>`);
  const [members, invites] = await Promise.all([Honey.backend.listMembers(), Honey.backend.listInvites()]);
  const open = invites.filter((i) => !i.usedBy);
  main.innerHTML = `
    <div class="card"><h2>הזמנה חדשה</h2>
      <p class="muted">כל קישור עובד פעם אחת. שולחים אותו למי שרוצים להזמין, והם נכנסים איתו עם Google.</p>
      <form class="row" id="nf"><input id="note" placeholder="למי ההזמנה? (לא חובה)"><button>יצירת קישור</button></form>
      <ul>${open.map((i) => `<li><span>${esc(i.note || "הזמנה ללא שם")}<br><code>${esc(link(i.code))}</code></span>
        <span class="row"><button class="ghost" data-copy="${esc(i.code)}">העתקה</button><button class="link" data-del="${esc(i.code)}">מחיקה</button></span></li>`).join("") || `<li><span class="muted">אין הזמנות פתוחות.</span></li>`}</ul>
    </div>
    <div class="card"><h2>החברים (${members.length})</h2>
      <form class="row" id="mf"><input id="em" type="email" dir="ltr" placeholder="gmail של מישהי להוספה ישירה"><button class="ghost">הוספה</button></form>
      <ul>${members.map((m) => `<li><span dir="ltr">${esc(m.email)}</span><button class="link" data-rm="${esc(m.email)}">הסרה</button></li>`).join("")}</ul>
    </div>`;
  $("#nf").onsubmit = async (e) => { e.preventDefault(); const c = await Honey.backend.createInvite(Honey.user.email, $("#note").value.trim()); await copy(link(c)); render(); };
  $("#mf").onsubmit = async (e) => { e.preventDefault(); const v = $("#em").value.trim(); if (v) { await Honey.backend.addMember(v, Honey.user.email); render(); } };
  main.onclick = async (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.copy) copy(link(b.dataset.copy));
    if (b.dataset.del && confirm("למחוק את ההזמנה?")) { await Honey.backend.deleteInvite(b.dataset.del); render(); }
    if (b.dataset.rm && confirm("להסיר את " + b.dataset.rm + "?")) { await Honey.backend.removeMember(b.dataset.rm); render(); }
  };
}
render();
Honey.onChange(render);
</script>
<script type="module" src="js/honey.js"></script>
</body>
</html>
