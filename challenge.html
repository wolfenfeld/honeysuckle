<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>אתגר</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&family=Andika:wght@700&family=Fredoka:wght@600;700&display=swap">
<style>
:root{--ink:#23304a;--muted:#5b6680;--line:#d8e3f7;--accent:#2f6fd6;--pink:#d63b70;--gold:#f2b705;--ok:#1f8a4c;--okbg:#e1f4e7;--bad:#c2412d;--badbg:#fbe5e0;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;font-family:"Rubik",system-ui,sans-serif;font-size:17px;color:var(--ink);min-height:100vh;background:linear-gradient(#dcebff,#f3ecff)}
.page{max-width:560px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
a.back{align-self:flex-start;color:var(--ink);background:#fff;border:2px solid var(--line);padding:8px 14px;border-radius:999px;text-decoration:none;font-weight:500;font-size:.95rem}
h1{font-family:"Fredoka","Rubik",sans-serif;margin:0;color:var(--accent);font-size:2rem}
.card{background:#fff;border:2px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px;align-items:stretch;text-align:center}
.muted{color:var(--muted);margin:0}
.bar{height:10px;border-radius:99px;background:#eef3ff;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pink);transition:width .3s}
.q{font-size:clamp(1.6rem,7vw,2.3rem);font-weight:800;direction:ltr;unicode-bidi:isolate;padding:16px;border-radius:16px;background:#eef3ff;overflow-wrap:anywhere}
.q.word{direction:rtl;font-size:1.5rem;line-height:1.6;font-weight:600}
.q .emo{display:block;font-size:2.8rem}
.q .he{display:block;font-size:2rem;font-weight:800}
.ans{font:inherit;font-size:1.6rem;text-align:center;padding:12px;border:3px solid var(--line);border-radius:14px;direction:ltr;width:100%}
.ans.en{font-family:"Andika",sans-serif;font-weight:700}
.ans:focus{outline:none;border-color:var(--accent)}
.ans.ok{border-color:var(--ok);background:var(--okbg)}
.ans.no{border-color:var(--bad);background:var(--badbg)}
.fb{min-height:1.6em;font-weight:700}
.btn{border:0;border-radius:14px;padding:12px 22px;background:var(--accent);color:#fff;font:inherit;font-weight:700;font-size:1.05rem;cursor:pointer;text-decoration:none;display:inline-block}
.btn.pink{background:var(--pink)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}
.big{font-size:3rem;font-weight:800;color:var(--accent);line-height:1}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<div class="page">
  <a class="back" href="friends.html">→ חזרה לחברים</a>
  <h1>⚔️ אתגר</h1>
  <div class="card" id="main"><p class="muted">טוען…</p></div>
</div>
<script src="js/mathgen.js"></script>
<script src="js/words.js"></script>
<script type="module">
import { Honey } from "./js/honey.js";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const id = new URLSearchParams(location.search).get("id");
const KINDS = ["add", "sub", "mul", "div", "par"];
let items = [], i = 0, correct = 0, chal = null, locked = false;

function say(t) { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = "en-US"; u.rate = .8; speechSynthesis.speak(u); } catch {} }
function msg(html) { $("#main").innerHTML = html; }

function build(c) {
  const rand = MathGen.seeded(c.seed);
  if (c.game === "math") {
    const G = MathGen.make(rand);
    return KINDS.slice(0, c.size).map((k) => { const it = G[k](); return { type: "math", q: it.ex + " =", a: String(it.ans) }; });
  }
  const seen = new Set(), words = [];
  DICT_GROUPS.forEach((g) => g.words.forEach(([en, he, emo]) => { if (!seen.has(en)) { seen.add(en); words.push({ en, he, emo }); } }));
  for (let k = words.length - 1; k > 0; k--) { const j = Math.floor(rand() * (k + 1)); [words[k], words[j]] = [words[j], words[k]]; }
  return words.slice(0, c.size).map((w) => ({ type: "word", he: w.he, emo: w.emo, a: w.en }));
}

async function start() {
  await Honey.ready;
  if (!Honey.enabled || !Honey.user || !Honey.isMember) return msg(`<p class="muted">צריך להיכנס עם חשבון מוזמן כדי לשחק אתגר.</p><a class="btn" href="friends.html">לחברים</a>`);
  chal = await Honey.backend.getChallenge(id).catch(() => null);
  if (!chal || chal.to !== Honey.user.uid) return msg(`<p class="muted">האתגר הזה לא נמצא או שהוא לא שלך.</p><a class="btn" href="friends.html">לחברים</a>`);
  if (chal.status !== "pending") return msg(`<p class="muted">את כבר פתרת את האתגר הזה (${chal.correct ?? 0} מתוך ${chal.size}).</p><a class="btn" href="friends.html">לחברים</a>`);
  items = build(chal);
  msg(`<div class="big">${chal.game === "math" ? "🌴" : "✏️"}</div><h2 style="margin:0">${items.length} תרגילים</h2><p class="muted">כל תשובה נכונה שווה 3 ⭐, ועוד 5 ⭐ בונוס על הכול נכון.</p><button class="btn pink" id="go">מתחילים</button>`);
  $("#go").onclick = show;
}
function show() {
  const it = items[i]; locked = false;
  const head = `<div class="muted">תרגיל ${i + 1} מתוך ${items.length}</div><div class="bar"><i style="width:${(i / items.length) * 100}%"></i></div>`;
  if (it.type === "math") msg(`${head}<div class="q">${esc(it.q)}</div><input class="ans" id="a" inputmode="numeric" autocomplete="off" aria-label="תשובה"><div class="fb" id="fb" aria-live="polite"></div><button class="btn" id="ok">בדיקה</button>`);
  else { msg(`${head}<div class="q word"><span class="emo">${esc(it.emo)}</span><span class="he">${esc(it.he)}</span>איך כותבים באנגלית?</div><button class="btn ghost" id="sp" type="button">🔊 להקשיב</button><input class="ans en" id="a" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="תשובה"><div class="fb" id="fb" aria-live="polite"></div><button class="btn" id="ok">בדיקה</button>`); $("#sp").onclick = () => say(it.a); say(it.a); }
  const a = $("#a"); a.focus();
  if (it.type === "math") a.oninput = () => (a.value = a.value.replace(/[^\d]/g, ""));
  $("#ok").onclick = check;
  a.onkeydown = (e) => { if (e.key === "Enter") check(); };
}
function check() {
  if (locked) return; const a = $("#a"), v = a.value.trim(); if (!v) return;
  locked = true; const it = items[i];
  const ok = it.type === "math" ? Number(v) === Number(it.a) : v.toLowerCase() === it.a.toLowerCase();
  if (ok) correct++;
  a.classList.add(ok ? "ok" : "no"); a.disabled = true;
  $("#fb").textContent = ok ? "נכון! 🎉" : `התשובה: ${it.a}`;
  const next = $("#ok"); next.textContent = i + 1 < items.length ? "הבא" : "לסיכום"; next.onclick = () => { i++; i < items.length ? show() : finish(); }; next.focus();
}
async function finish() {
  const stars = correct * 3 + (correct === items.length ? 5 : 0);
  msg(`<div class="big">${correct} / ${items.length}</div><p class="muted">שומרת…</p>`);
  try { await Honey.backend.completeChallenge(id, correct); } catch (e) { console.warn(e); }
  Honey.award("ch-" + id, stars, { persist: true });
  msg(`<div class="big">${correct} / ${items.length}</div><h2 style="margin:0">${correct === items.length ? "מושלם! 🌟" : correct >= 3 ? "יפה מאוד! 🎉" : "ממשיכים להתאמן 💪"}</h2><p class="muted">קיבלת ${stars} ⭐</p><a class="btn pink" href="cats.html">לאלבום החתולים</a><a class="btn ghost" href="friends.html">חזרה לחברים</a>`);
}
start();
</script>
</body>
</html>
