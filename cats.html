<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>אלבום החתולים</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&family=Suez+One&display=swap">
<link rel="stylesheet" href="css/cards.css">
<link rel="stylesheet" href="css/theme.css">
<style>
.wallet{display:flex;flex-direction:column;gap:12px;align-items:stretch;text-align:center}
.wallet .row1{display:flex;align-items:center;gap:12px}
.wallet .row1 .t-bar{flex:1}
.wallet .hint{color:var(--muted);font-weight:500}
.wallet .t-btn.big{font-size:1.3rem;padding:12px 30px;align-self:center;min-width:min(100%,280px)}
.where{font-size:.85rem;color:var(--muted);margin:0}
.done{background:#fff4c2;border:3px solid var(--k);border-radius:20px;padding:14px 18px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-weight:800;font-size:1.15rem;box-shadow:0 4px 0 var(--k-soft)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.count{color:var(--muted);font-weight:500;font-size:.95rem}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (min-width:640px){.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}}
/* pack opening */
dialog{border:0;padding:0;background:transparent;max-width:100vw;max-height:100vh;overflow:visible}
dialog::backdrop{background:rgba(35,22,14,.85)}
.stage{display:flex;flex-direction:column;align-items:center;gap:16px;padding:22px 20px 24px;color:var(--k);text-align:center;width:min(92vw,380px);background-color:var(--cream);background-image:radial-gradient(#d8c9a6 1.4px,transparent 1.5px);background-size:22px 22px;border:3px solid var(--k);border-radius:28px;box-shadow:0 10px 0 rgba(0,0,0,.25)}
.ribbon{position:relative;background:#fffaf0;border:3px solid var(--k);border-radius:8px;padding:6px 30px;font-weight:800;font-size:1.6rem;box-shadow:0 3px 0 var(--k-soft)}
.ribbon::before,.ribbon::after{content:"";position:absolute;top:10px;width:30px;height:100%;background:#f1e5c8;border:3px solid var(--k);z-index:-1}
.ribbon::before{right:-24px;clip-path:polygon(0 0,100% 0,70% 50%,100% 100%,0 100%)}
.ribbon::after{left:-24px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,30% 50%)}
.burst{position:absolute;inset:-40px;pointer-events:none;z-index:5}
.burst i{position:absolute;left:50%;top:50%;font-style:normal;font-size:1.3rem;opacity:0;animation:pop 1.1s ease-out forwards}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1) rotate(var(--r));opacity:0}}
.detail .cat{width:min(70vw,290px)}
.detail .frame{aspect-ratio:87/97}
.detail .nm{font-size:1.4rem}
.detail .ico{font-size:1.05rem}
.flip{position:relative;width:min(70vw,280px);aspect-ratio:87/115;perspective:900px}
.flip .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.flip.show .in{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip .back{border-radius:18px;border:4px solid #fff;background:repeating-linear-gradient(45deg,#e0475b 0 14px,#f06b7d 14px 28px);display:grid;place-items:center;font-size:4.5rem;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.flip .back.shake{animation:shake .5s ease-in-out infinite}
@keyframes shake{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.flip .front{transform:rotateY(180deg)}
.flip .front .cat{width:100%;height:100%}
.flip .front .frame{flex:1;aspect-ratio:auto}
.flip .front .nm{font-size:1.2rem}
.reveal{min-height:90px;display:flex;flex-direction:column;gap:6px;align-items:center}
.reveal h2{margin:0;font-weight:800;font-size:1.7rem}
.reveal .new{background:var(--yellow);color:var(--k);border:3px solid var(--k);border-radius:999px;padding:2px 14px;font-weight:800;font-size:.9rem}
.stage .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
dialog::backdrop{background:rgba(35,22,14,.8)}
</style>
</head>
<body class="themed">
<div class="t-page">
  <div class="t-top"><a class="t-back" href="index.html#home" aria-label="חזרה לדף הבית">→</a><h1>אלבום החתולים 🐱</h1></div>
  <section class="t-card wallet" aria-label="הכוכבים שלי">
    <div class="row1"><span class="t-pill" id="pts">0 ⭐</span><div class="t-bar"><i id="bar" style="width:0"></i></div></div>
    <div class="hint" id="hint"></div>
    <button class="t-btn big" id="open" type="button">🎁 פתיחת חבילה</button>
    <p class="where" id="where"></p>
  </section>
  <div class="done" id="done" hidden>🎉 האלבום שלם! <a class="t-btn" href="poster.html">🖼️ לפוסטר שלי</a></div>
  <div class="filters" id="filters" role="group" aria-label="סינון לפי נדירות"></div>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
</div>

<dialog id="detail" aria-label="פרטי קלף">
  <div class="stage detail">
    <div id="dcard"></div>
    <div class="reveal" id="dtext"></div>
    <button class="t-btn" id="dclose" type="button">סגירה</button>
  </div>
</dialog>

<dialog id="dlg" aria-label="פתיחת חבילה">
  <div class="stage">
    <div class="ribbon" id="ribbon">🎁</div>
    <div class="flip" id="flip"><div class="burst" id="burst" aria-hidden="true"></div><div class="in">
      <div class="face back" id="back">🐾</div>
      <div class="face front" id="front"></div>
    </div></div>
    <div class="reveal" id="reveal"></div>
    <div class="row" id="drow" hidden>
      <button class="t-btn" id="close" type="button">להוסיף לאלבום</button>
      <button class="t-btn ghost" id="again" type="button">🎁 עוד חבילה</button>
    </div>
  </div>
</dialog>

<script type="module">
import { Honey } from "./js/honey.js";
import { CARDS, RARITY, COST, MAX_COPIES, catIcons } from "./js/cards.js";
import { cardHTML, esc } from "./js/cardview.js";
const { Rewards } = Honey;
const $ = (s) => document.querySelector(s);
let filter = 0;
function render() {
  const st = Rewards.state, pts = st.points;
  $("#pts").textContent = `${pts} ⭐`;
  $("#bar").style.width = Math.min(100, (pts / COST) * 100) + "%";
  const packs = Math.floor(pts / COST);
  $("#hint").textContent = packs ? `אפשר לפתוח ${packs} ${packs === 1 ? "חבילה" : "חבילות"}!` : `עוד ${COST - pts} כוכבים לחבילה הבאה (חבילה עולה ${COST}).`;
  $("#open").disabled = pts < COST || CARDS.every((c) => (st.cards[c.id] || 0) >= MAX_COPIES);
  $("#where").textContent = Rewards.mode === "cloud" ? "☁️ נשמר בחשבון שלך, ונשאר בכל מכשיר." : "נשמר בדפדפן הזה. כניסה עם Google (בהזמנה) שומרת את האלבום בכל מכשיר.";
  const ownedN = CARDS.filter((c) => st.cards[c.id]).length;
  $("#count").textContent = `נאספו ${ownedN} מתוך ${CARDS.length} קלפים · אפשר להחזיק עד ${MAX_COPIES} עותקים מכל קלף, והכפולים טובים להחלפה עם חברים`;
  $("#done").hidden = ownedN < CARDS.length;
  $("#filters").innerHTML = [`<button class="t-chip" data-r="0" aria-pressed="${filter === 0}">הכול</button>`]
    .concat([1, 2, 3, 4, 5].map((r) => {
      const all = CARDS.filter((c) => c.r === r), have = all.filter((c) => st.cards[c.id]).length;
      return `<button class="t-chip" data-r="${r}" aria-pressed="${filter === r}">${catIcons(r)} ${have}/${all.length}</button>`;
    })).join("");
  const list = CARDS.filter((c) => !filter || c.r === filter);
  $("#grid").innerHTML = list.map((c) => cardHTML(c, { owned: !!st.cards[c.id], count: st.cards[c.id] || 0 })).join("");
}
$("#filters").onclick = (e) => { const b = e.target.closest("[data-r]"); if (b) { filter = +b.dataset.r; render(); } };
Rewards.onChange(render);

/* ---- pack opening ---- */
const dlg = $("#dlg");
let busy = false;
function openPack() {
  if (busy || Rewards.state.points < COST) return;
  const res = Rewards.open(); if (!res) return;
  busy = true;
  $("#flip").classList.remove("show"); $("#reveal").innerHTML = ""; $("#drow").hidden = true; $("#burst").innerHTML = ""; $("#ribbon").textContent = "פותחים…";
  $("#front").innerHTML = cardHTML(res.card, { showDup: false });
  const back = $("#back"); back.classList.add("shake");
  if (!dlg.open) dlg.showModal();
  const fast = matchMedia("(prefers-reduced-motion: reduce)").matches;
  setTimeout(() => {
    back.classList.remove("shake"); $("#flip").classList.add("show");
    setTimeout(() => {
      const r = RARITY[res.card.r], c = res.card;
      $("#ribbon").textContent = res.isNew ? "קלף חדש!" : "כבר יש לך!";
      sparkle(c.r);
      const wow = c.r === 5 ? "אגדי! 🌟" : c.r === 4 ? "אפי! ✨" : c.r === 3 ? "נדיר! 🎉" : "";
      $("#reveal").innerHTML = `<h2>${esc(c.he)}</h2><div>${catIcons(c.r)} · ${r.name}</div>${wow ? `<b>${wow}</b>` : ""}${res.isNew ? `<span class="new">חדש באלבום!</span>` : `<span>כבר יש לך (×${res.count}${res.count >= MAX_COPIES ? ", המקסימום" : ""}). אפשר להחליף עם חבר</span>`}${CARDS.every((x) => Rewards.state.cards[x.id]) ? `<b>🎉 האלבום שלם!</b><a class="t-btn" href="poster.html">🖼️ לפוסטר</a>` : ""}`;
      $("#drow").hidden = false; $("#again").disabled = Rewards.state.points < COST; $("#again").focus();
      busy = false;
    }, fast ? 0 : 900);
  }, fast ? 0 : 900);
}
// A burst of confetti and sparkles around the card; bigger for rarer cards.
function sparkle(rarity) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const set = rarity >= 4 ? ["✨", "⭐", "🌟", "🎉", "💫"] : ["✨", "🎉", "⭐"];
  const n = 8 + rarity * 5, box = $("#burst"); box.innerHTML = "";
  for (let k = 0; k < n; k++) {
    const a = (k / n) * Math.PI * 2 + Math.random() * .5, d = 110 + Math.random() * 90, i = document.createElement("i");
    i.textContent = set[k % set.length];
    i.style.cssText = `--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d}px;--r:${Math.round(Math.random() * 120 - 60)}deg;animation-delay:${Math.random() * .25}s;font-size:${1 + Math.random() * 1.1}rem`;
    box.append(i);
  }
}
$("#open").onclick = openPack;
$("#again").onclick = openPack;
$("#close").onclick = () => dlg.close();
dlg.addEventListener("close", () => { busy = false; render(); });

/* ---- tap an owned card to see it big ---- */
const detail = $("#detail");
$("#grid").addEventListener("click", (e) => {
  const el = e.target.closest(".cat[data-card]"); if (!el || el.classList.contains("locked")) return;
  const c = CARDS.find((x) => x.id === el.dataset.card), n = Rewards.state.cards[c.id] || 1;
  $("#dcard").innerHTML = cardHTML(c, { count: n, showDup: false });
  $("#dtext").innerHTML = `<div>${catIcons(c.r)} · ${RARITY[c.r].name}</div><div class="t-muted">יש לך ${n} ${n === 1 ? "עותק" : "עותקים"} (אפשר עד ${MAX_COPIES})</div>`;
  detail.showModal();
});
$("#dclose").onclick = () => detail.close();
detail.addEventListener("click", (e) => { if (e.target === detail) detail.close(); });

render();
if (location.hash === "#open") { history.replaceState(null, "", location.pathname + location.search); }
</script>
</body>
</html>
