<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>היכל התהילה</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="css/theme.css">
<style>
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs .t-chip{flex:none;white-space:nowrap}
.tabs .t-chip[aria-selected="true"]{background:#8fd98b}
.board{background-color:#fffaf0;background-image:linear-gradient(#efe6cf 1px,transparent 1px),linear-gradient(90deg,#efe6cf 1px,transparent 1px);background-size:22px 22px;display:flex;flex-direction:column;gap:12px}
.board h2{margin:0;font-size:1.15rem;font-weight:800}
.board .blurb{margin:0;color:var(--muted);font-size:.92rem}
.podium{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:6px;align-items:end;padding-top:34px}
.pod{display:flex;flex-direction:column;align-items:center;min-width:0}
.pav{position:relative;width:72px;height:72px;border-radius:50%;border:3px solid var(--k);background:#fff3d8;display:grid;place-items:center;overflow:hidden;font-size:2.3rem;box-shadow:0 0 0 3px #fff;margin-bottom:-14px;z-index:1}
.pav .pimg{width:100%;height:100%;border-radius:0}
.pod.p1 .pav{width:84px;height:84px}
.crown{font-size:2rem;line-height:1;margin-bottom:-6px;z-index:2;filter:drop-shadow(0 2px 0 rgba(51,35,26,.3))}
.block{width:100%;border:3px solid var(--k);border-radius:10px 10px 0 0;padding:20px 4px 8px;text-align:center;display:flex;flex-direction:column;gap:2px;justify-content:flex-start}
.block .nm{font-weight:800;font-size:1.05rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.block .sc{font-size:.88rem;font-weight:500;font-variant-numeric:tabular-nums}
.p1 .block{background:linear-gradient(#ffe48a,#f6cf4a);min-height:150px}
.p2 .block{background:linear-gradient(#e4e5e8,#cfd0d3);min-height:118px}
.p3 .block{background:linear-gradient(#e2a674,#cf8f5a);min-height:96px}
.pod.empty{opacity:.35}
.pod.me .block{outline:4px solid #2f6fd6;outline-offset:2px}
.list{display:flex;flex-direction:column;gap:2px;padding:10px}
.row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;font-weight:700}
.row .rk{width:1.6em;text-align:center;font-size:1.05rem;font-variant-numeric:tabular-nums}
.row .av{width:40px;height:40px;border-radius:50%;border:2.5px solid var(--k);background:#fff3d8;display:grid;place-items:center;overflow:hidden;flex:none;font-size:1.4rem}
.row .av .pimg{width:100%;height:100%;border-radius:0}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .nm small{display:block;color:var(--muted);font-weight:500;font-size:.78rem}
.row .sc{font-variant-numeric:tabular-nums;font-size:1.05rem}
.row.me{background:#f2c80f;border:3px solid var(--k);box-shadow:0 3px 0 var(--k-soft)}
.row.me .nm small{color:#5a4300}
.mine{background:#f2c80f;border:3px solid var(--k);border-radius:14px;padding:10px 14px;font-weight:800;text-align:center}
.note{margin:0;color:var(--muted);text-align:center}
.gate{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.gate h2{margin:0}.gate p{margin:0;color:var(--muted)}
</style>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body class="themed">
<div class="t-page">
  <div class="t-top"><a class="t-back" href="index.html#home" aria-label="חזרה לדף הבית">→</a><h1>היכל התהילה</h1><span class="t-back" style="width:48px;height:48px;border-radius:14px" aria-hidden="true">🏆</span></div>
  <div id="main"><p class="t-muted">טוען…</p></div>
</div>
<script type="module">
import { Honey, GAMES } from "./js/honey.js";
import { avatarHTML } from "./js/avatar.js";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const SHORT = { math: "חשבון", worksheet: "תרגילי המבחן", dictation: "הכתבה", quiz: "בוחן מילים" };
let board = null, game = sessionStorage.getItem("hall-game") || "math";
if (!GAMES[game]) game = "math";

function gate(title, text, button) {
  $("#main").innerHTML = `<div class="t-card gate"><h2>${title}</h2><p>${text}</p>${button ? `<button class="t-btn pink" id="g">${button}</button>` : ""}</div>`;
  if (button) $("#g").onclick = Honey.signIn;
}
async function render() {
  await Honey.ready;
  if (!Honey.enabled) return gate("עוד לא פעיל", "היכל התהילה יתחבר ברגע שהכניסה לאתר תוגדר. בינתיים כל המשחקים עובדים כרגיל.");
  if (!Honey.user) return gate("נכנסים כדי לראות", "היכל התהילה פתוח רק למי שהוזמנו.", "🔑 כניסה עם Google");
  if (!Honey.isMember) return gate("אין עדיין גישה", `נכנסת כ-${esc(Honey.user.email)}, אבל האתר הזה בהזמנה בלבד. אפשר לבקש קישור הזמנה ולפתוח אותו במכשיר הזה.`);
  try { board ||= await Honey.leaderboard(); }
  catch { return gate("משהו השתבש", "לא הצלחנו לטעון את הטבלה. נסי לרענן."); }
  const tabs = Object.keys(GAMES).map((k) => `<button class="t-chip" role="tab" data-g="${k}" aria-selected="${k === game}">${SHORT[k]}</button>`).join("");
  $("#main").innerHTML = `<div class="tabs" role="tablist">${tabs}</div><div id="panel" style="margin-top:12px;display:flex;flex-direction:column;gap:14px"></div>`;
  document.querySelectorAll(".tabs .t-chip").forEach((b) => (b.onclick = () => { game = b.dataset.g; sessionStorage.setItem("hall-game", game); render(); }));
  panel();
}
const sub = (r) => { const t = [r.school, r.grade && "כיתה " + r.grade].filter(Boolean).join(" · "); return t ? `<small>${esc(t)}</small>` : ""; };
function panel() {
  const g = GAMES[game], rows = board[game], me = Honey.user.uid;
  const top = rows.slice(0, 10), myIdx = rows.findIndex((r) => r.uid === me);
  const pod = (i, cls) => {
    const r = rows[i];
    return r ? `<div class="pod ${cls}${r.uid === me ? " me" : ""}">${i === 0 ? '<span class="crown" aria-hidden="true">👑</span>' : ""}<div class="pav">${avatarHTML(r)}</div><div class="block"><span class="nm">${esc(r.name)}</span><span class="sc">${esc(g.unit(r.best, r.total))}</span></div></div>`
             : `<div class="pod ${cls} empty"><div class="pav">❔</div><div class="block"><span class="nm">פנוי</span></div></div>`;
  };
  $("#panel").innerHTML = rows.length ? `
    <div class="t-card board"><h2>${g.icon} ${g.title}</h2><p class="blurb">${g.blurb}</p>
      <div class="podium">${pod(1, "p2")}${pod(0, "p1")}${pod(2, "p3")}</div></div>
    ${top.length > 3 ? `<div class="t-card list">${top.slice(3).map((r, i) => `<div class="row${r.uid === me ? " me" : ""}"><span class="rk">${i + 4}</span><span class="av">${avatarHTML(r)}</span><span class="nm">${esc(r.name)}${sub(r)}</span><span class="sc">${esc(g.unit(r.best, r.total))}</span></div>`).join("")}</div>` : ""}
    ${myIdx >= 10 ? `<div class="mine">המקום שלך: ${myIdx + 1} (${esc(g.unit(rows[myIdx].best, rows[myIdx].total))})</div>` : ""}
    ${myIdx < 0 ? `<p class="note">עוד לא פרסמת תוצאה במשחק הזה. משחקים, ובסוף הסיבוב מופיע כפתור פרסום.</p>` : ""}`
    : `<div class="t-card"><p class="note">עוד אף אחד לא פרסם תוצאה כאן. אפשר להיות הראשונה! 🌟</p></div>`;
}
render();
Honey.onChange(() => { board = null; render(); });
</script>
</body>
</html>
