<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>חברים</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&family=Fredoka:wght@500;700&display=swap">
<link rel="stylesheet" href="css/cards.css">
<style>
:root{--ink:#23304a;--muted:#5b6680;--bg:#eaf2ff;--card:#fff;--line:#d8e3f7;--accent:#2f6fd6;--pink:#d63b70;--gold:#f2b705;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;font-family:"Rubik",system-ui,sans-serif;font-size:17px;color:var(--ink);min-height:100vh;background:linear-gradient(#dcebff,#f3ecff)}
.page{max-width:820px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
a.back{align-self:flex-start;color:var(--ink);background:#fff;border:2px solid var(--line);padding:8px 14px;border-radius:999px;text-decoration:none;font-weight:500;font-size:.95rem}
h1{font-family:"Fredoka","Rubik",sans-serif;font-weight:700;font-size:clamp(2rem,6vw,2.8rem);margin:0;color:var(--accent);line-height:1.05}
h2{margin:0;font-size:1.2rem}
.sub{margin:4px 0 0;color:var(--muted)}
.invrow{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.invite[hidden]{display:none}
.tabs{display:flex;gap:8px}
.tab{border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:9px 18px;font:inherit;font-weight:600;cursor:pointer}
.tab[aria-selected="true"]{background:var(--pink);border-color:var(--pink);color:#fff}
.panel{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-radius:14px}
.row .grow{flex:1;min-width:160px}
.row .av{font-size:1.6rem}
.muted{color:var(--muted);font-size:.92rem}
.btn{border:0;border-radius:12px;padding:9px 16px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.btn.pink{background:var(--pink)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{font-size:.8rem;background:#eef3ff;border-radius:999px;padding:2px 10px;color:var(--muted)}
.pill.ok{background:#e1f4e7;color:#1f6b3b}
.pill.wait{background:#fff4c2;color:#6b5400}
select,input{font:inherit;padding:9px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.form{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.picks{display:flex;gap:6px}
.picks label{cursor:pointer}
.picks input{position:absolute;opacity:0}
.picks span{display:inline-block;padding:8px 14px;border-radius:999px;border:2px solid var(--line);font-weight:600}
.picks input:checked+span{background:var(--accent);border-color:var(--accent);color:#fff}
.picks input:focus-visible+span{outline:3px solid var(--gold)}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.pickgrid button{border:0;background:none;padding:0;cursor:pointer;border-radius:14px;text-align:center}
.pickgrid button[aria-pressed="true"]{outline:4px solid var(--pink);outline-offset:2px}
.pickgrid .cat{aspect-ratio:87/97}
.swap{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.swap{grid-template-columns:1fr}}
.swap h3{margin:0 0 6px;font-size:1rem}
.offer{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.offer .cat{width:74px;flex:none}
.offer .arrow{font-size:1.4rem}
.gate{background:var(--card);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.gate p{margin:0;color:var(--muted)}
button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<div class="page">
  <a class="back" href="index.html#home">→ חזרה לדף הבית</a>
  <header>
    <h1>👥 חברים</h1>
    <p class="sub">שולחים אתגרים קצרים שמזכים בכוכבים, ומחליפים קלפים כפולים.</p>
  </header>
  <div class="panel invite" id="invite" hidden>
    <div class="invrow"><div><h2>👋 הזמנת חברים</h2><p class="muted">לוחצים, שולחים בוואטסאפ, וזהו. מי שפותח את הקישור נכנס עם Google ומצטרף ישר.</p></div><button class="btn pink" id="invbtn" type="button">📤 שליחת קישור</button></div>
    <form class="form" id="invform"><input type="email" id="invemail" dir="ltr" placeholder="המייל של החבר/ה (Gmail)" aria-label="מייל של חבר/ה" required style="flex:1;min-width:200px"><button class="btn">✉️ הזמנה במייל</button></form>
    <p class="muted" id="invmsg" role="status" style="margin:0;font-weight:600"></p>
    <p class="muted" style="margin:0">הכתובת מקבלת הרשאה ישר, ונפתח מייל מוכן לשליחה מתוכנת המייל שלך. החבר/ה נכנסים עם חשבון Google באותה כתובת.</p>
  </div>
  <div id="main"><p class="sub">טוען…</p></div>
</div>
<script type="module">
import { Honey } from "./js/honey.js";
import { CARDS, RARITY, MAX_COPIES, catIcons } from "./js/cards.js";
import { cardHTML, cardById, esc } from "./js/cardview.js";
import { avatarHTML } from "./js/avatar.js";
const $ = (s) => document.querySelector(s);
const GAMES = { math: "חשבון", dictation: "הכתבה" };
const REWARD = "עד 20 ⭐";
let tab = sessionStorage.getItem("friends-tab") || "ch";
let me, people = [], byId = {}, ch = { received: [], sent: [] }, tr = { incoming: [], outgoing: [] };
let myCards = {}, tradeTo = "", theirCards = null, give = null, want = null;
const person = (uid) => byId[uid] || { name: "שחקנית", avatar: "⭐" };
const who = (uid) => `<span class="av">${avatarHTML(person(uid))}</span> <b>${esc(person(uid).name)}</b>`;
const mini = (id) => cardHTML(cardById[id], { small: true, showDup: false });

function gate(t, text, btn) {
  $("#main").innerHTML = `<div class="gate"><h2>${t}</h2><p>${text}</p>${btn ? `<button class="btn" id="g">${btn}</button>` : ""}</div>`;
  if (btn) $("#g").onclick = Honey.signIn;
}
async function load() {
  await Honey.ready;
  if (!Honey.enabled) return gate("עוד לא פעיל", "הכניסה לאתר עוד לא הוגדרה.");
  if (!Honey.user) return gate("נכנסים כדי לראות", "החלק הזה פתוח רק למי שהוזמנו.", "🔑 כניסה עם Google");
  if (!Honey.isMember) return gate("אין עדיין גישה", "האתר הזה בהזמנה בלבד. אפשר לבקש קישור הזמנה.");
  me = Honey.user.uid;
  $("#invite").hidden = false; $("#invbtn").onclick = () => Honey.invite();
  $("#invform").onsubmit = async (e) => {
    e.preventDefault();
    const say = (t) => { $("#invmsg").textContent = t; };
    try { if (await Honey.inviteByEmail($("#invemail").value, say)) $("#invemail").value = ""; }
    catch (err) { console.warn(err); say("שגיאה: " + (err.message || err)); }
  };
  const be = Honey.backend;
  try {
    [people, ch, tr, myCards] = await Promise.all([be.listProfiles(), be.listChallenges(me), be.listTrades(me), be.getRewardsOf(me).then((r) => r.cards || {})]);
  } catch (e) { console.warn(e); return gate("משהו השתבש", "לא הצלחנו לטעון. נסי לרענן."); }
  byId = Object.fromEntries(people.map((p) => [p.uid, p]));
  render();
}
function friendsOptions(selected) {
  return people.filter((p) => p.uid !== me).map((p) => `<option value="${esc(p.uid)}" ${p.uid === selected ? "selected" : ""}>${esc(p.name)}</option>`).join("");
}
function render() {
  $("#main").innerHTML = `<div class="tabs" role="tablist">
    <button class="tab" role="tab" data-t="ch" aria-selected="${tab === "ch"}">⚔️ אתגרים</button>
    <button class="tab" role="tab" data-t="tr" aria-selected="${tab === "tr"}">🔁 החלפות</button></div>
    <div id="body"></div>`;
  document.querySelectorAll(".tab").forEach((b) => (b.onclick = () => { tab = b.dataset.t; sessionStorage.setItem("friends-tab", tab); render(); }));
  tab === "ch" ? renderChallenges() : renderTrades();
}

/* ---------- challenges ---------- */
function renderChallenges() {
  const todo = ch.received.filter((c) => c.status === "pending"), done = ch.received.filter((c) => c.status !== "pending");
  const others = people.filter((p) => p.uid !== me);
  $("#body").innerHTML = `
  <div class="panel"><h2>אתגרים שקיבלת</h2>
    <p class="muted">אתגר הוא סט קצר של 5 תרגילים. כל תשובה נכונה שווה 3 ⭐, ועוד 5 ⭐ בונוס על 5 מתוך 5.</p>
    <div class="list">${todo.map((c) => `<div class="row"><span class="grow">${who(c.from)} שלח/ה לך אתגר ${GAMES[c.game] || ""}<br><span class="muted">${c.size} תרגילים · ${REWARD}</span></span><a class="btn pink" href="challenge.html?id=${esc(c.id)}">להתחיל</a></div>`).join("") || `<p class="muted">אין אתגרים שממתינים לך.</p>`}</div>
    ${done.length ? `<div class="list">${done.slice(0, 5).map((c) => `<div class="row"><span class="grow">${who(c.from)} · ${GAMES[c.game] || ""}</span><span class="pill ok">${c.correct ?? 0} מתוך ${c.size}</span></div>`).join("")}</div>` : ""}
  </div>
  <div class="panel"><h2>שליחת אתגר</h2>
    ${others.length ? `<form class="form" id="cf">
      <select id="cto" aria-label="למי לשלוח">${friendsOptions("")}</select>
      <div class="picks" role="radiogroup" aria-label="משחק">
        <label><input type="radio" name="g" value="math" checked><span>🌴 חשבון</span></label>
        <label><input type="radio" name="g" value="dictation"><span>✏️ הכתבה</span></label></div>
      <button class="btn pink">שליחה</button></form>
      <p class="muted" id="cmsg">החבר/ה יקבלו את אותם 5 תרגילים, ויזכו בכוכבים כשיסיימו.</p>` : `<p class="muted">עוד אין חברים עם פרופיל. כשמישהו מצטרף הוא יופיע כאן.</p>`}
    ${ch.sent.length ? `<h2>אתגרים ששלחתי</h2><div class="list">${ch.sent.slice(0, 8).map((c) => `<div class="row"><span class="grow">${who(c.to)} · ${GAMES[c.game] || ""}</span>${c.status === "done" ? `<span class="pill ok">נפתר: ${c.correct ?? 0} מתוך ${c.size}</span>` : `<span class="pill wait">ממתין</span>`}</div>`).join("")}</div>` : ""}
  </div>`;
  $("#cf")?.addEventListener("submit", async (e) => {
    e.preventDefault();
    const to = $("#cto").value, game = new FormData(e.target).get("g");
    try {
      await Honey.backend.createChallenge({ from: me, to, game, seed: Math.floor(Math.random() * 2 ** 31), size: 5 });
      ch = await Honey.backend.listChallenges(me); renderChallenges();
      $("#cmsg").textContent = `האתגר נשלח ל${person(to).name} ✔️`;
    } catch (err) { console.warn(err); $("#cmsg").textContent = "לא הצלחנו לשלוח. נסי שוב."; }
  });
}

/* ---------- trades ---------- */
const have = (id) => myCards[id] || 0;
function renderTrades() {
  const inc = tr.incoming.filter((t) => t.status === "open");
  const out = tr.outgoing.slice(0, 8);
  $("#body").innerHTML = `
  <div class="panel"><h2>הצעות החלפה אליך</h2>
    <div class="list">${inc.map((t) => {
      const can = have(t.want) >= 1 && have(t.give) < MAX_COPIES;
      const why = have(t.want) < 1 ? `אין לך את ${esc(cardById[t.want]?.he)}` : have(t.give) >= MAX_COPIES ? `כבר יש לך 3 מ-${esc(cardById[t.give]?.he)}` : have(t.want) === 1 ? "זה העותק האחרון שלך" : "";
      return `<div class="row"><div class="grow"><div>${who(t.from)} מציע/ה:</div>
        <div class="offer">${mini(t.give)}<span class="arrow">⇄</span>${mini(t.want)}</div>
        ${why ? `<div class="muted">${why}</div>` : ""}</div>
        <button class="btn" data-acc="${esc(t.id)}" ${can ? "" : "disabled"}>אישור</button><button class="btn ghost" data-dec="${esc(t.id)}">דחייה</button></div>`;
    }).join("") || `<p class="muted">אין הצעות שממתינות לך.</p>`}</div>
  </div>
  <div class="panel"><h2>הצעה חדשה</h2>
    <p class="muted">מחליפים רק קלפים כפולים: נותנים קלף שיש לך ממנו 2 או 3, ומקבלים קלף שחסר לך או שיש לך ממנו פחות מ-3. הקלף שהצעת נשמר בצד עד שהחבר/ה עונה.</p>
    <div class="form"><select id="tto" aria-label="עם מי להחליף"><option value="">בחרי חבר/ה</option>${friendsOptions(tradeTo)}</select></div>
    <div id="builder"></div>
  </div>
  ${out.length ? `<div class="panel"><h2>ההצעות ששלחתי</h2><div class="list">${out.map((t) => `<div class="row"><div class="grow">${who(t.to)}<div class="offer">${mini(t.give)}<span class="arrow">⇄</span>${mini(t.want)}</div></div>
    ${t.status === "open" ? `<span class="pill wait">ממתין</span><button class="btn ghost" data-cancel="${esc(t.id)}">ביטול</button>` : t.status === "accepted" ? `<span class="pill ok">אושר${t.claimed ? "" : " (הקלף יגיע בכניסה הבאה)"}</span>` : t.status === "declined" ? `<span class="pill">נדחה</span>` : `<span class="pill">בוטל</span>`}</div>`).join("")}</div></div>` : ""}`;
  $("#tto").onchange = async (e) => { tradeTo = e.target.value; give = want = null; theirCards = null; if (tradeTo) { try { theirCards = (await Honey.backend.getRewardsOf(tradeTo)).cards || {}; } catch { theirCards = {}; } } builder(); };
  $("#body").onclick = onTradeClick;
  builder();
}
function builder() {
  const el = $("#builder"); if (!el) return;
  if (!tradeTo) return (el.innerHTML = "");
  if (!theirCards) return (el.innerHTML = `<p class="muted">טוען…</p>`);
  const mine = CARDS.filter((c) => have(c.id) >= 2);
  const theirs = CARDS.filter((c) => (theirCards[c.id] || 0) >= 2 && have(c.id) < MAX_COPIES);
  const grid = (list, kind, sel) => list.length ? `<div class="pickgrid">${list.map((c) => `<button type="button" data-${kind}="${c.id}" aria-pressed="${sel === c.id}" aria-label="${esc(c.he)}">${cardHTML(c, { small: true, count: kind === "give" ? have(c.id) : theirCards[c.id] })}</button>`).join("")}</div>` : "";
  el.innerHTML = `<div class="swap">
    <div><h3>אני נותנת (הכפולים שלי)</h3>${grid(mine, "give", give) || `<p class="muted">אין לך עדיין קלפים כפולים. פותחים עוד חבילות!</p>`}</div>
    <div><h3>אני מקבלת (הכפולים של ${esc(person(tradeTo).name)})</h3>${grid(theirs, "want", want) || `<p class="muted">אין ל${esc(person(tradeTo).name)} כרגע כפולים שמתאימים לך.</p>`}</div></div>
    <div class="form"><button class="btn pink" id="send" ${give && want ? "" : "disabled"}>שליחת הצעה</button><span class="muted" id="tmsg"></span></div>`;
}
async function onTradeClick(e) {
  const g = e.target.closest("[data-give]"), w = e.target.closest("[data-want]");
  if (g) { give = g.dataset.give === give ? null : g.dataset.give; return builder(); }
  if (w) { want = w.dataset.want === want ? null : w.dataset.want; return builder(); }
  const be = Honey.backend, b = e.target.closest("button"); if (!b) return;
  const refresh = async () => { await Honey.Rewards.refresh(); [tr, myCards] = await Promise.all([be.listTrades(me), be.getRewardsOf(me).then((r) => r.cards || {})]); give = want = null; renderTrades(); };
  try {
    if (b.id === "send") {
      if (have(give) < 2) return;
      b.disabled = true;
      await be.createTrade(me, { to: tradeTo, give, want });
      await refresh();
      $("#tmsg") && ($("#tmsg").textContent = "ההצעה נשלחה ✔️");
    } else if (b.dataset.acc || b.dataset.dec) {
      const t = tr.incoming.find((x) => x.id === (b.dataset.acc || b.dataset.dec));
      if (b.dataset.acc) {
        myCards = (await be.getRewardsOf(me)).cards || {};
        if (have(t.want) < 1 || have(t.give) >= MAX_COPIES) { renderTrades(); return; }
      }
      b.disabled = true; await be.respondTrade(me, t, !!b.dataset.acc); await refresh();
    } else if (b.dataset.cancel) {
      const t = tr.outgoing.find((x) => x.id === b.dataset.cancel);
      b.disabled = true; await be.cancelTrade(me, t); await refresh();
    }
  } catch (err) { console.warn(err); alert("משהו השתבש, נסי שוב."); }
}
load();
Honey.onChange(() => { if (!me) load(); });
</script>
</body>
</html>
