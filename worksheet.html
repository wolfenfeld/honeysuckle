<!doctype html><html lang="he" dir="rtl"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><title>החשבון של יערה – תרגילי המבחן</title></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Varela+Round&display=swap">
<style>
:root{
  --paper:#f7f9fc; --grid:#dfe7f2; --ink:#1f2a44; --muted:#5b6782;
  --card:#ffffff; --line:#c9d4e5; --accent:#2f6fd6; --accent-ink:#ffffff;
  --good:#1f8a4c; --good-bg:#e3f5ea; --bad:#c2412d; --bad-bg:#fbe7e3;
  --sec-add:#2f6fd6; --sec-sub:#8a4fd1; --sec-mul:#d97a12; --sec-par:#0f8a86; --sec-div:#c23b6e;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#141a26; --grid:#1d2536; --ink:#e7ecf6; --muted:#9aa6c0;
    --card:#1b2233; --line:#2e3a52; --accent:#6f9ff0; --accent-ink:#0f1522;
    --good:#5fd08f; --good-bg:#16352a; --bad:#ff8a73; --bad-bg:#3a1f1b;
    --sec-add:#6f9ff0; --sec-sub:#b58af0; --sec-mul:#f0a24a; --sec-par:#4fd1c5; --sec-div:#f07aa8;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#141a26; --grid:#1d2536; --ink:#e7ecf6; --muted:#9aa6c0;
  --card:#1b2233; --line:#2e3a52; --accent:#6f9ff0; --accent-ink:#0f1522;
  --good:#5fd08f; --good-bg:#16352a; --bad:#ff8a73; --bad-bg:#3a1f1b;
  --sec-add:#6f9ff0; --sec-sub:#b58af0; --sec-mul:#f0a24a; --sec-par:#4fd1c5; --sec-div:#f07aa8;
}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink);
  font-family:"Varela Round","Rubik",system-ui,sans-serif;
  font-size:16px;
  padding:24px 16px 48px;
}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
header{display:flex;flex-direction:column;gap:6px}
h1{font-family:"Rubik",sans-serif;font-weight:700;font-size:2rem;margin:0;text-wrap:balance}
header p{margin:0;color:var(--muted);max-width:65ch}
.score{
  display:flex;flex-wrap:wrap;align-items:center;gap:12px;
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;
}
.score strong{font-family:"Rubik",sans-serif;font-size:1.4rem;font-variant-numeric:tabular-nums}
.score .msg{color:var(--muted);flex:1;min-width:180px}
#sections{display:flex;flex-direction:column;gap:24px}
section{
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 16px;
  display:flex;flex-direction:column;gap:14px;border-top:5px solid var(--c);
}
section.add{--c:var(--sec-add)} section.sub{--c:var(--sec-sub)} section.mul{--c:var(--sec-mul)} section.par{--c:var(--sec-par)} section.div{--c:var(--sec-div)}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h2{margin:0;font-family:"Rubik",sans-serif;font-size:1.35rem;color:var(--c)}
.tip{margin:0;color:var(--muted);font-size:.95rem}
.sec-score{color:var(--muted);font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
section.par .grid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.item{
  display:flex;align-items:center;gap:10px;justify-content:flex-end;
  padding:8px 10px;border-radius:10px;border:1px solid transparent;
}
.item .n{color:var(--muted);font-size:.85rem;min-width:1.5em;text-align:center}
.ex{direction:ltr;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;font-family:"Rubik",sans-serif;font-size:1.25rem;font-variant-numeric:tabular-nums}
.ex input{
  width:4.8em;font:inherit;text-align:center;padding:4px 6px;
  border:2px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);
}
.ex input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.mark{width:1.3em;text-align:center;font-weight:700}
.item.ok{background:var(--good-bg);border-color:var(--good)}
.item.ok .mark{color:var(--good)}
.item.no{background:var(--bad-bg);border-color:var(--bad)}
.item.no .mark{color:var(--bad)}
.btns{display:flex;flex-wrap:wrap;gap:10px}
button{
  font-family:"Rubik",sans-serif;font-size:1rem;font-weight:500;cursor:pointer;
  padding:10px 18px;border-radius:10px;border:2px solid var(--accent);
  background:var(--accent);color:var(--accent-ink);
}
button.ghost{background:transparent;color:var(--accent)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.sec-btn{align-self:flex-start;background:var(--c);border-color:var(--c);color:var(--accent-ink)}
.home-link{display:inline-block;margin:0 0 14px;padding:8px 14px;border-radius:999px;background:var(--card,#fff);border:2px solid var(--line,#ddd);color:var(--ink,#222);text-decoration:none;font-weight:500;font-family:inherit;font-size:.95rem}.home-link:hover{filter:brightness(.97)}
</style>

<div class="wrap" dir="rtl">
  <a class="home-link" href="index.html#home">→ חזרה לדף הבית</a>
  <header>
    <h1>החשבון של יערה</h1>
    <p>כותבים את התשובה בתיבה ולוחצים על "בדיקה". ✓ ירוק זה נכון, ✗ אדום זה לנסות שוב.</p>
  </header>

  <div class="score">
    <strong id="total">0 / 30</strong>
    <span class="msg" id="totalMsg">עדיין לא בדקנו. בהצלחה!</span>
    <div class="btns">
      <button id="checkAll">בדיקת כל התרגילים</button>
      <button id="reset" class="ghost">להתחיל מחדש</button>
    </div>
  </div>

  <div id="sections"></div>
</div>

<script>
const DATA = [
  {key:"add", title:"חיבור (אלפים)", items:[
    "2345 + 1432","3618 + 2457","1584 + 3697",
    "5307 + 2896","6485 + 2738","4876 + 3958"]},
  {key:"sub", title:"חיסור (אלפים)", items:[
    "5876 − 2354","6250 − 2735","8004 − 3567",
    "5003 − 1748","8243 − 5678","9502 − 6789"]},
  {key:"mul", title:"כפל (דו-ספרתי ועשרות)", items:[
    "23 × 3","32 × 4","27 × 6",
    "56 × 7","79 × 9","30 × 40"]},
  {key:"div", title:"חילוק", tip:"אפשר לבדוק כל תשובה בכפל: התשובה כפול המחלק צריכה לתת את המספר שהתחלנו ממנו.", items:[
    "84 ÷ 4","72 ÷ 6","168 ÷ 7",
    "344 ÷ 8","480 ÷ 6","2400 ÷ 40"]},
  {key:"par", title:"סוגריים וסדר פעולות", tip:"קודם פותרים מה שבתוך הסוגריים, אחר כך כפל, ובסוף חיבור וחיסור.", items:[
    "(25 + 15) × 3","25 + 15 × 3","(80 − 30) × 4",
    "80 − 30 × 2","(7 + 8) × (9 − 4)","5 × (40 − 18) + 12"]}
];
const solve = ex => Function('"use strict";return ('+ex.replace(/×/g,"*").replace(/−/g,"-").replace(/÷/g,"/")+')')();
const root = document.getElementById("sections");

DATA.forEach(sec=>{
  const s = document.createElement("section");
  s.className = sec.key;
  s.innerHTML = `<div class="sec-head"><h2>${sec.title}</h2><span class="sec-score" id="sc-${sec.key}"></span></div>`
    + (sec.tip?`<p class="tip">${sec.tip}</p>`:"") + `<div class="grid"></div>`;
  const grid = s.querySelector(".grid");
  sec.items.forEach((ex,i)=>{
    const id = `${sec.key}-${i}`;
    const row = document.createElement("div");
    row.className = "item";
    row.innerHTML = `<span class="n">${i+1}</span>
      <span class="ex"><span>${ex} =</span>
      <input id="${id}" type="text" inputmode="numeric" autocomplete="off" aria-label="תשובה לתרגיל ${i+1}: ${ex}">
      <span class="mark" aria-live="polite"></span></span>`;
    row.dataset.ans = solve(ex);
    grid.appendChild(row);
  });
  const btn = document.createElement("button");
  btn.className = "sec-btn"; btn.textContent = "בדיקה";
  btn.addEventListener("click",()=>{checkSection(sec.key); updateTotal();});
  s.appendChild(btn);
  root.appendChild(s);
});

function checkRow(row){
  const inp = row.querySelector("input"), mark = row.querySelector(".mark");
  const v = inp.value.trim();
  row.classList.remove("ok","no");
  if(v===""){ mark.textContent=""; return null; }
  const ok = Number(v)===Number(row.dataset.ans);
  row.classList.add(ok?"ok":"no");
  mark.textContent = ok?"✓":"✗";
  return ok;
}
function checkSection(key){
  let c=0;
  document.querySelectorAll(`section.${key} .item`).forEach(r=>{ if(checkRow(r)) c++; });
  document.getElementById("sc-"+key).textContent = `${c} מתוך 6 נכונים`;
}
function updateTotal(){
  const c = document.querySelectorAll(".item.ok").length;
  document.getElementById("total").textContent = `${c} / 30`;
  document.getElementById("totalMsg").textContent =
      c===30 ? "מושלם! כל הכבוד יערה! 🌟"
    : c>=24 ? "מצוין! נשארו רק כמה לתקן."
    : c>=15 ? "יפה מאוד, ממשיכים!"
    : c>0 ? "התחלה טובה, אפשר לתקן ולבדוק שוב."
    : "עדיין לא בדקנו. בהצלחה!";
}
document.getElementById("checkAll").addEventListener("click",()=>{DATA.forEach(s=>checkSection(s.key)); updateTotal(); if(window.Honey) Honey.offer("worksheet", document.querySelectorAll(".item.ok").length, 30);});
document.getElementById("reset").addEventListener("click",()=>{
  document.querySelectorAll(".item").forEach(r=>{r.classList.remove("ok","no"); r.querySelector("input").value=""; r.querySelector(".mark").textContent="";});
  DATA.forEach(s=>document.getElementById("sc-"+s.key).textContent="");
  updateTotal();
});
document.addEventListener("input",e=>{
  if(e.target.matches(".ex input")){
    e.target.value = e.target.value.replace(/[^\d]/g,"");
    const row = e.target.closest(".item"); row.classList.remove("ok","no"); row.querySelector(".mark").textContent="";
  }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter" && e.target.matches(".ex input")){
    const all=[...document.querySelectorAll(".ex input")]; const i=all.indexOf(e.target);
    if(all[i+1]) all[i+1].focus();
  }
});
</script>

<script type="module" src="js/honey.js"></script>
</body></html>
