<!doctype html><html lang="he" dir="rtl"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><script>if(window.top===window){location.replace("index.html"+(location.search.indexOf("demo")>=0?"?demo":"")+"#math-test")}else{document.documentElement.classList.add("embed")}</script><title>החשבון של יערה – תרגילי המבחן</title></head><body class="themed">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Varela+Round&display=swap">
<link rel="stylesheet" href="css/theme.css">
<style>
body{padding:0;font-size:17px}
/* Shown inside a room (iframe, ?embed=1): the room provides the header and the star bar. */
html.embed body{background:transparent!important;margin:0!important}
html.embed .hc{display:none!important}
html.embed .t-top .t-back,html.embed .t-top h1,html.embed .sub,html.embed .lead{display:none}
html.embed .t-top{justify-content:flex-end;margin:0}
html.embed .wrap{padding:0 0 12px;max-width:none}

.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding:12px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.pill{direction:ltr;unicode-bidi:isolate;background:#2e9e5b;color:#fff;border:3px solid var(--k);border-radius:999px;padding:6px 14px;font-weight:800;font-variant-numeric:tabular-nums;box-shadow:0 3px 0 var(--k-soft)}
.lead{margin:0;color:var(--muted)}
.score{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:#fff;border:3px solid var(--k);border-radius:20px;padding:12px 14px;box-shadow:0 4px 0 var(--k-soft)}
.score strong{font-size:1.3rem;font-variant-numeric:tabular-nums}
.score .msg{color:var(--muted);flex:1 1 100%;font-weight:500}
.btns{display:flex;flex-wrap:wrap;gap:10px}
button{font:inherit;font-weight:700;cursor:pointer;padding:9px 18px;border-radius:999px;border:3px solid var(--k);background:var(--yellow);color:var(--k);box-shadow:0 3px 0 var(--k-soft);min-height:44px}
button.ghost{background:#fff}
button:active{transform:translateY(2px)}
#sections{display:flex;flex-direction:column;gap:16px}
section{--c:#2e9e5b;background:#fff;border:3px solid var(--k);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:0 4px 0 var(--k-soft)}
section.add{--c:#e0475b} section.sub{--c:#d99a00} section.mul{--c:#2f6fd6} section.par{--c:#0f8a86} section.div{--c:#8a3fb0}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h2{margin:0;font-size:1.2rem;font-weight:800;display:flex;align-items:center;gap:10px}
h2::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--c);border:2.5px solid var(--k)}
.tip{margin:0;color:var(--muted);font-size:.95rem}
.sec-score{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.9rem}
.grid{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:640px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.item{display:flex;align-items:center;gap:10px;justify-content:flex-end;padding:8px 10px;border-radius:14px;border:2.5px solid transparent;background:#fffaf0}
.item .n{color:#a08c78;font-size:.85rem;min-width:1.5em;text-align:center}
.ex{direction:ltr;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;flex:1;font-family:"Rubik",sans-serif;font-size:1.3rem;font-weight:600;font-variant-numeric:tabular-nums}
.ex input{width:5.2em;font:inherit;font-weight:700;text-align:center;padding:5px 8px;border:3px solid var(--k);border-radius:14px;background:#fff;color:var(--k)}
.ex input:focus{outline:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 40%,transparent)}
.mark{width:1.3em;text-align:center;font-weight:800;font-size:1.3rem}
.item.ok{background:#d9f3e1;border-color:#2e9e5b}
.item.ok .mark{color:#1f8a4c}
.item.no{background:#fbdcdc;border-color:#d64545}
.item.no .mark{color:#c2412d}
.sec-btn{align-self:flex-start;background:var(--c);color:#fff}
</style>

<div class="wrap" dir="rtl">
  <div class="t-top"><a class="t-back" href="index.html#home" aria-label="חזרה לדף הבית">→</a><h1>תרגילי המבחן</h1><span class="pill" id="total">0 / 30</span></div>
  <p class="lead">כותבים את התשובה בתיבה ולוחצים על "בדיקה". ✓ ירוק זה נכון, ✗ אדום זה לנסות שוב.</p>

  <div class="score">
    <span class="msg" id="totalMsg">עדיין לא בדקנו. בהצלחה!</span>
    <div class="btns">
      <button id="checkAll">בדיקת כל התרגילים</button>
      <button id="reset" class="ghost">להתחיל מחדש</button>
    </div>
  </div>

  <div id="sections"></div>
</div>

<script>
const DATA = [
  {key:"add", title:"חיבור (אלפים)", items:[
    "2345 + 1432","3618 + 2457","1584 + 3697",
    "5307 + 2896","6485 + 2738","4876 + 3958"]},
  {key:"sub", title:"חיסור (אלפים)", items:[
    "5876 − 2354","6250 − 2735","8004 − 3567",
    "5003 − 1748","8243 − 5678","9502 − 6789"]},
  {key:"mul", title:"כפל (דו-ספרתי ועשרות)", items:[
    "23 × 3","32 × 4","27 × 6",
    "56 × 7","79 × 9","30 × 40"]},
  {key:"div", title:"חילוק", tip:"אפשר לבדוק כל תשובה בכפל: התשובה כפול המחלק צריכה לתת את המספר שהתחלנו ממנו.", items:[
    "84 ÷ 4","72 ÷ 6","168 ÷ 7",
    "344 ÷ 8","480 ÷ 6","2400 ÷ 40"]},
  {key:"par", title:"סוגריים וסדר פעולות", tip:"קודם פותרים מה שבתוך הסוגריים, אחר כך כפל, ובסוף חיבור וחיסור.", items:[
    "(25 + 15) × 3","25 + 15 × 3","(80 − 30) × 4",
    "80 − 30 × 2","(7 + 8) × (9 − 4)","5 × (40 − 18) + 12"]}
];
const solve = ex => Function('"use strict";return ('+ex.replace(/×/g,"*").replace(/−/g,"-").replace(/÷/g,"/")+')')();
const root = document.getElementById("sections");

DATA.forEach(sec=>{
  const s = document.createElement("section");
  s.className = sec.key;
  s.innerHTML = `<div class="sec-head"><h2>${sec.title}</h2><span class="sec-score" id="sc-${sec.key}"></span></div>`
    + (sec.tip?`<p class="tip">${sec.tip}</p>`:"") + `<div class="grid"></div>`;
  const grid = s.querySelector(".grid");
  sec.items.forEach((ex,i)=>{
    const id = `${sec.key}-${i}`;
    const row = document.createElement("div");
    row.className = "item";
    row.innerHTML = `<span class="n">${i+1}</span>
      <span class="ex"><span>${ex} =</span>
      <input id="${id}" type="text" inputmode="numeric" autocomplete="off" aria-label="תשובה לתרגיל ${i+1}: ${ex}">
      <span class="mark" aria-live="polite"></span></span>`;
    row.dataset.ans = solve(ex);
    grid.appendChild(row);
  });
  const btn = document.createElement("button");
  btn.className = "sec-btn"; btn.textContent = "בדיקה";
  btn.addEventListener("click",()=>{checkSection(sec.key); updateTotal();});
  s.appendChild(btn);
  root.appendChild(s);
});

function checkRow(row){
  const inp = row.querySelector("input"), mark = row.querySelector(".mark");
  const v = inp.value.trim();
  row.classList.remove("ok","no");
  if(v===""){ mark.textContent=""; return null; }
  const ok = Number(v)===Number(row.dataset.ans);
  row.classList.add(ok?"ok":"no");
  mark.textContent = ok?"✓":"✗";
  return ok;
}
function checkSection(key){
  let c=0;
  document.querySelectorAll(`section.${key} .item`).forEach(r=>{ if(checkRow(r)) c++; });
  document.getElementById("sc-"+key).textContent = `${c} מתוך 6 נכונים`;
}
function updateTotal(){
  const c = document.querySelectorAll(".item.ok").length;
  document.getElementById("total").textContent = `${c} / 30`;
  if(window.Honey) Honey.award("ws-"+new Date().toISOString().slice(0,10), c+(c===30?5:0), {persist:true});
  document.getElementById("totalMsg").textContent =
      c===30 ? "מושלם! כל הכבוד יערה! 🌟"
    : c>=24 ? "מצוין! נשארו רק כמה לתקן."
    : c>=15 ? "יפה מאוד, ממשיכים!"
    : c>0 ? "התחלה טובה, אפשר לתקן ולבדוק שוב."
    : "עדיין לא בדקנו. בהצלחה!";
}
document.getElementById("checkAll").addEventListener("click",()=>{DATA.forEach(s=>checkSection(s.key)); updateTotal(); if(window.Honey) Honey.offer("worksheet", document.querySelectorAll(".item.ok").length, 30);});
document.getElementById("reset").addEventListener("click",()=>{
  document.querySelectorAll(".item").forEach(r=>{r.classList.remove("ok","no"); r.querySelector("input").value=""; r.querySelector(".mark").textContent="";});
  DATA.forEach(s=>document.getElementById("sc-"+s.key).textContent="");
  updateTotal();
});
document.addEventListener("input",e=>{
  if(e.target.matches(".ex input")){
    e.target.value = e.target.value.replace(/[^\d]/g,"");
    const row = e.target.closest(".item"); row.classList.remove("ok","no"); row.querySelector(".mark").textContent="";
  }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter" && e.target.matches(".ex input")){
    const all=[...document.querySelectorAll(".ex input")]; const i=all.indexOf(e.target);
    if(all[i+1]) all[i+1].focus();
  }
});
</script>

<script type="module" src="js/honey.js"></script>
</body></html>
